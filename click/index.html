<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>thummim mekuria</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #000;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            overflow: hidden;
        }

        canvas#stars {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 1;
        }

        .glitter-particle {
            position: fixed;
            pointer-events: none;
            border-radius: 50%;
            z-index: 9999;
            animation: glitter-fade 0.8s ease-out forwards;
        }

        @keyframes glitter-fade {
            0% { opacity: 1; transform: scale(1) translateY(0); }
            100% { opacity: 0; transform: scale(0) translateY(20px); }
        }

        .container {
            position: relative;
            width: 500px;
            height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
        }


        /* Arrows */
        .arrow {
            position: absolute;
            font-size: 60px;
            font-weight: bold;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .arrow-up {
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #FF6B6B;
            animation-delay: 0s;
        }

        .arrow-down {
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #4ECDC4;
            animation-delay: 0.3s;
        }

        .arrow-left {
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #FFE66D;
            animation-delay: 0.15s;
        }

        .arrow-right {
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #95E1D3;
            animation-delay: 0.45s;
        }

        .arrow-up-left {
            top: 50px;
            left: 50px;
            color: #F38181;
            animation-delay: 0.1s;
        }

        .arrow-up-right {
            top: 50px;
            right: 50px;
            color: #AA96DA;
            animation-delay: 0.2s;
        }

        .arrow-down-left {
            bottom: 50px;
            left: 50px;
            color: #FCBAD3;
            animation-delay: 0.35s;
        }

        .arrow-down-right {
            bottom: 50px;
            right: 50px;
            color: #A8D8EA;
            animation-delay: 0.5s;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
            50% {
                transform: scale(1.1) translateY(-10px);
                opacity: 0.7;
            }
        }

        .arrow-left {
            animation: pulse-left 1.5s ease-in-out infinite;
        }

        .arrow-right {
            animation: pulse-right 1.5s ease-in-out infinite;
        }

        @keyframes pulse-left {
            0%, 100% {
                transform: translateY(-50%) translateX(0);
                opacity: 1;
            }
            50% {
                transform: translateY(-50%) translateX(-10px);
                opacity: 0.7;
            }
        }

        @keyframes pulse-right {
            0%, 100% {
                transform: translateY(-50%) translateX(0);
                opacity: 1;
            }
            50% {
                transform: translateY(-50%) translateX(10px);
                opacity: 0.7;
            }
        }

        /* Button */
        .button {
            padding: 20px 60px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            background: linear-gradient(45deg, #FF6B6B, #FFE66D);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            z-index: 10;
        }

        .button:hover {
            transform: scale(1.1);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        }

        .button:active {
            transform: scale(0.95);
        }

        /* Feedback message */
        .feedback {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px 50px;
            border-radius: 10px;
            font-size: 28px;
            font-weight: bold;
            color: #667eea;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .feedback.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <canvas id="stars"></canvas>
    <div class="container">
        <!-- Arrows pointing inward -->
        <div class="arrow arrow-up">↓</div>
        <div class="arrow arrow-down">↑</div>
        <div class="arrow arrow-left">→</div>
        <div class="arrow arrow-right">←</div>
        <div class="arrow arrow-up-left">↘</div>
        <div class="arrow arrow-up-right">↙</div>
        <div class="arrow arrow-down-left">↗</div>
        <div class="arrow arrow-down-right">↖</div>

        <!-- Button -->
        <button class="button" onclick="handleClick()">Click Here</button>
    </div>

    <!-- Feedback message -->
    <div class="feedback" id="feedback">You clicked it! 🎉</div>

    <script>
        function handleClick() {
            window.open("https://stream-crown-70b.notion.site/3573ae34af4d8023b987e755b2cb38b5?pvs=74");
            const feedback = document.getElementById('feedback');
            feedback.classList.add('show');
            setTimeout(() => feedback.classList.remove('show'), 1500);
        }

        // Starfield background
        const canvas = document.getElementById('stars');
        const ctx = canvas.getContext('2d');
        let stars = [];

        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }

        function initStars() {
            stars = [];
            for (let i = 0; i < 200; i++) {
                stars.push({
                    x: Math.random() * canvas.width,
                    y: Math.random() * canvas.height,
                    r: Math.random() * 1.5 + 0.2,
                    alpha: Math.random(),
                    speed: Math.random() * 0.005 + 0.002
                });
            }
        }

        function drawStars() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            stars.forEach(s => {
                s.alpha += s.speed;
                if (s.alpha > 1 || s.alpha < 0) s.speed *= -1;
                ctx.beginPath();
                ctx.arc(s.x, s.y, s.r, 0, Math.PI * 2);
                ctx.fillStyle = `rgba(255,255,255,${s.alpha})`;
                ctx.fill();
            });
            requestAnimationFrame(drawStars);
        }

        resizeCanvas();
        initStars();
        drawStars();
        window.addEventListener('resize', () => { resizeCanvas(); initStars(); });

        // Glitter trail
        const colors = ['#ff6ef7','#ffe66d','#6ef7ff','#ff6b6b','#a8ff78','#ffffff','#c77dff','#4ecdc4'];

        document.addEventListener('mousemove', (e) => {
            for (let i = 0; i < 5; i++) {
                const p = document.createElement('div');
                p.className = 'glitter-particle';
                const size = Math.random() * 8 + 3;
                const color = colors[Math.floor(Math.random() * colors.length)];
                const offsetX = (Math.random() - 0.5) * 20;
                const offsetY = (Math.random() - 0.5) * 20;
                p.style.cssText = `
                    width: ${size}px;
                    height: ${size}px;
                    left: ${e.clientX + offsetX}px;
                    top: ${e.clientY + offsetY}px;
                    background: ${color};
                    box-shadow: 0 0 ${size * 2}px ${color};
                    animation-duration: ${Math.random() * 0.5 + 0.5}s;
                `;
                document.body.appendChild(p);
                p.addEventListener('animationend', () => p.remove());
            }
        });
    </script>
</body>
</html>
