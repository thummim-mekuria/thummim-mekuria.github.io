<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Click Here</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            width: 100%;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            overflow: hidden;
        }

        .container {
            position: relative;
            width: 500px;
            height: 500px;
            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* Arrows */
        .arrow {
            position: absolute;
            font-size: 60px;
            font-weight: bold;
            animation: pulse 1.5s ease-in-out infinite;
        }

        .arrow-up {
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #FF6B6B;
            animation-delay: 0s;
        }

        .arrow-down {
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #4ECDC4;
            animation-delay: 0.3s;
        }

        .arrow-left {
            left: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #FFE66D;
            animation-delay: 0.15s;
        }

        .arrow-right {
            right: 20px;
            top: 50%;
            transform: translateY(-50%);
            color: #95E1D3;
            animation-delay: 0.45s;
        }

        .arrow-up-left {
            top: 50px;
            left: 50px;
            color: #F38181;
            animation-delay: 0.1s;
        }

        .arrow-up-right {
            top: 50px;
            right: 50px;
            color: #AA96DA;
            animation-delay: 0.2s;
        }

        .arrow-down-left {
            bottom: 50px;
            left: 50px;
            color: #FCBAD3;
            animation-delay: 0.35s;
        }

        .arrow-down-right {
            bottom: 50px;
            right: 50px;
            color: #A8D8EA;
            animation-delay: 0.5s;
        }

        @keyframes pulse {
            0%, 100% {
                transform: scale(1) translateY(0);
                opacity: 1;
            }
            50% {
                transform: scale(1.1) translateY(-10px);
                opacity: 0.7;
            }
        }

        .arrow-left {
            animation: pulse-left 1.5s ease-in-out infinite;
        }

        .arrow-right {
            animation: pulse-right 1.5s ease-in-out infinite;
        }

        @keyframes pulse-left {
            0%, 100% {
                transform: translateY(-50%) translateX(0);
                opacity: 1;
            }
            50% {
                transform: translateY(-50%) translateX(-10px);
                opacity: 0.7;
            }
        }

        @keyframes pulse-right {
            0%, 100% {
                transform: translateY(-50%) translateX(0);
                opacity: 1;
            }
            50% {
                transform: translateY(-50%) translateX(10px);
                opacity: 0.7;
            }
        }

        /* Button */
        .button {
            padding: 20px 60px;
            font-size: 24px;
            font-weight: bold;
            color: white;
            background: linear-gradient(45deg, #FF6B6B, #FFE66D);
            border: none;
            border-radius: 50px;
            cursor: pointer;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
            text-transform: uppercase;
            letter-spacing: 2px;
            position: relative;
            z-index: 10;
        }

        .button:hover {
            transform: scale(1.1);
            box-shadow: 0 15px 40px rgba(0, 0, 0, 0.4);
        }

        .button:active {
            transform: scale(0.95);
        }

        /* Feedback message */
        .feedback {
            position: fixed;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            background: white;
            padding: 30px 50px;
            border-radius: 10px;
            font-size: 28px;
            font-weight: bold;
            color: #667eea;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.3);
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s ease;
        }

        .feedback.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Arrows pointing inward -->
        <div class="arrow arrow-up">↓</div>
        <div class="arrow arrow-down">↑</div>
        <div class="arrow arrow-left">→</div>
        <div class="arrow arrow-right">←</div>
        <div class="arrow arrow-up-left">↘</div>
        <div class="arrow arrow-up-right">↙</div>
        <div class="arrow arrow-down-left">↗</div>
        <div class="arrow arrow-down-right">↖</div>

        <!-- Button -->
        <button class="button" onclick="handleClick()">Click Here</button>
    </div>

    <!-- Feedback message -->
    <div class="feedback" id="feedback">You clicked it! 🎉</div>

    <script>
        function handleClick() {
            window.open("https://stream-crown-70b.notion.site/3573ae34af4d8023b987e755b2cb38b5?pvs=74");
            const feedback = document.getElementById('feedback');
            feedback.classList.add('show');
            
            setTimeout(() => {
                feedback.classList.remove('show');
            }, 1500);
        }
    </script>
</body>
</html>
