<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ቱሚም ጌታሁን መኩሪያ</title>
    <link rel="stylesheet" href="desktop.css">
    <style>
        body {
            /* the photo (4:3) is zoomed in so the patch of clear sky 26% of the way down it
               sits right under the menu bar, behind the icon row */
            --bg-w: max(150vw, calc((100vh - 60px) / 0.555));
            background: #2a5a96 url('background_puffy_clouds.jpg') no-repeat fixed;
            background-size: var(--bg-w) auto;
            background-position: center calc(60px - 0.26 * 0.75 * var(--bg-w));
        }
    </style>
</head>
<body>

    <div class="menubar">
        <a class="name" href="index.html">thummim mekuria</a>
        <span id="clock"></span>
    </div>

    <!-- each icon: href = where it goes, svg <use> = which icon.
         icons are laid out left to right across the top in the order they appear here -->
    <div class="desktop" id="desktop">
        <!-- sticky note: drag it by the paper, click the links to open them -->
        <div class="icon note">
            <b>contact info</b>
            <div class="rows">
                <span>email:</span>    <a href="mailto:tmekuria@ucsc.edu">tmekuria@ucsc.edu</a>
                <span>linkedin:</span> <a href="https://www.linkedin.com/in/thummim-mekuria" target="_blank">linkedin.com/in/thummim-mekuria</a>
                <span>github:</span>   <a href="https://github.com/thummim-mekuria" target="_blank">github.com/thummim-mekuria</a>
            </div>
        </div>
        <a class="icon" href="resume.pdf" target="_blank">
            <svg><use href="#i-pdf"/></svg>
            <span>resume.pdf</span>
        </a>
        <a class="icon" href="astrophysics.html">
            <div class="emoji">🌟</div>
            <span>astrophysics</span>
        </a>
        <a class="icon" href="https://github.com/thummim-mekuria/erdos_project" target="_blank">
            <div class="emoji">💰</div>
            <span>quant</span>
        </a>
        <a class="icon" href="misc.html">
            <div class="emoji">📂</div>
            <span>misc</span>
        </a>
    </div>

    <div class="hint">click an icon to open it · drag to rearrange</div>

    <script src="desktop.js"></script>
</body>
</html>
