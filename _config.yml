remote_theme: "mmistakes/minimal-mistakes@4.28.0"
minimal_mistakes_skin: "default"

locale: "en-US"
title: "Thummim Mekuria"
# TODO: your tagline — shows under your name on the hero banner
subtitle: ""
description: >-
  TODO: one-line description of you and your work — used for search results
  and link previews.
url: "https://thummim-mekuria.github.io"
repository: "thummim-mekuria/thummim-mekuria.github.io"

search: true

author:
  name: "Thummim Mekuria"
  avatar: # TODO: "/assets/images/headshot.jpg" — square-ish photo for the sidebar
  bio: "TODO: short bio, one line."
  location: "Santa Cruz, CA"
  email: "tmekuria@ucsc.edu"
  links:
    - label: "Email"
      icon: "fas fa-fw fa-square-envelope"
      url: "mailto:tmekuria@ucsc.edu"
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/thummim-mekuria"
    # TODO: uncomment and fill in whichever apply
    # - label: "ORCID"
    #   icon: "fab fa-fw fa-orcid"
    #   url: "https://orcid.org/YOUR-ORCID"
    # - label: "arXiv"
    #   icon: "fas fa-fw fa-book"
    #   url: "https://arxiv.org/a/YOUR-ARXIV-ID"

footer:
  links:
    - label: "GitHub"
      icon: "fab fa-fw fa-github"
      url: "https://github.com/thummim-mekuria"

include: ["_pages"]

collections:
  research:
    output: true
    permalink: /:collection/:path/

defaults:
  - scope:
      path: ""
      type: pages
    values:
      layout: single
      author_profile: true
  - scope:
      path: ""
      type: research
    values:
      layout: single
      author_profile: true
      share: false

plugins:
  - jekyll-include-cache
  - jekyll-feed
  - jekyll-seo-tag
  - jekyll-sitemap

# /click is the standalone gag page — keep Jekyll's hands off it
keep_files:
  - click

exclude:
  - README.md
